name: PaliEduca CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ─── FRONTEND CI ───
  frontend-build:
    name: 🎨 Frontend Type-Check & Build (Vercel Ready)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Instalar Dependências do Frontend
        working-directory: frontend
        run: npm ci

      - name: 🛡️ TypeScript Check & Vite Production Build
        working-directory: frontend
        run: npm run build

  # ─── BACKEND CI ───
  backend-test:
    name: 🐍 Backend Lint, Import & Unit Tests (Render Ready)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: 📦 Instalar Dependências do Backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Executar Testes Automatizados da API
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci_test.db
          JWT_SECRET_KEY: ci_jwt_secret_test_key_palieduca_2026
          GROQ_API_KEY: fake_ci_key
        run: |
          python test_suite_ci.py
