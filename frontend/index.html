  <!-- Detecção Imediata de Modo Noturno / Claro (Android, iOS, Windows, Mac, Linux) -->
  <script>
    (function() {
      try {
        const savedTheme = localStorage.getItem('palieduca-theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark) || (savedTheme === 'system' && systemPrefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>

  <!-- SEO Primário -->
  <title>Palieduca — Cuidados Paliativos em Enfermagem UFPB</title>

  <!-- Script SPA para GitHub Pages com URLs Limpas (Sem '#') -->
  <script type="text/javascript">
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>
